name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android (si absente)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generer les icones Android
        run: |
          RES=android/app/src/main/res
          declare -A LEGACY=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A ADAPTIVE=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for d in "${!LEGACY[@]}"; do
            mkdir -p "$RES/mipmap-$d"
            convert resources/icon.png -resize ${LEGACY[$d]}x${LEGACY[$d]} "$RES/mipmap-$d/ic_launcher.png"
            convert resources/icon.png -resize ${LEGACY[$d]}x${LEGACY[$d]} "$RES/mipmap-$d/ic_launcher_round.png"
          done
          for d in "${!ADAPTIVE[@]}"; do
            mkdir -p "$RES/mipmap-$d"
            convert resources/icon-foreground.png -resize ${ADAPTIVE[$d]}x${ADAPTIVE[$d]} "$RES/mipmap-$d/ic_launcher_foreground.png"
            convert resources/icon-background.png -resize ${ADAPTIVE[$d]}x${ADAPTIVE[$d]} "$RES/mipmap-$d/ic_launcher_background.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" << 'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Ajouter l'App ID AdMob dans AndroidManifest.xml (si absent)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4323566518250268~9172490383"/>\n    </application>#' "$MANIFEST"
          fi

      - name: Construire l'APK (debug)
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Mettre l'APK (debug) à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: nextcv-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Décoder la clé de signature
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/nextcv-release.keystore

      - name: Construire la version signée (AAB + APK release)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=nextcv-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Mettre l'AAB signé à disposition (pour le Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: nextcv-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Mettre l'APK signé à disposition (pour tester sur ton téléphone)
        uses: actions/upload-artifact@v4
        with:
          name: nextcv-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
